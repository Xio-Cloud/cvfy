name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate static files
        run: |
          npm run generate || true
          rm -rf dist
          mkdir -p dist
          cp -r .output/public/* dist/ 2>/dev/null || true
          cp -r .nuxt/dist/client/* dist/ 2>/dev/null || true
          cp -r public/* dist/ 2>/dev/null || true
          if [ ! -f dist/index.html ]; then
            echo "Error: Static site build failed - dist/index.html not generated!"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create cvfy --production-branch=main || true
          npx wrangler pages deploy dist --project-name=cvfy --branch=main --commit-dirty=true
